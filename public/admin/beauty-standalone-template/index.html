<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <title>美容室テンプレ（独立版）— 管理画面</title>
  <link rel="stylesheet" href="styles.css?v=28" />
</head>
<body>

<div class="app-root">

  <!-- ── Header ── -->
  <header class="app-header">
    <span
      class="beauty-standalone-rev-badge"
      title="デプロイ・キャッシュ確認用。数字を上げたリリースかどうかの目印です（ヘッダー左端）。"
      aria-hidden="true"
    >28</span>
    <div class="app-header-brand">
      <h1>美容室テンプレ（独立版）</h1>
      <p class="header-sub">ホットペッパー全文 → LP 自動生成（mellowとは別管理）</p>
    </div>
    <nav class="header-actions" aria-label="主要操作">
      <a class="btn btn-ghost-admin" href="/admin/outreach-phases-beauty.html?v=7phase">送付・フェーズ管理（美容）</a>
      <a class="btn btn-ghost-admin" href="/admin/template-worker.html">店舗ドラフト編集（cafe）</a>
      <button class="btn btn-primary-admin" id="btn-save-server" type="button">サーバーに保存</button>
      <button class="btn btn-secondary-admin" id="btn-reset" type="button">リセット</button>
      <button class="btn btn-primary-admin" id="btn-export" type="button">LP を開く →</button>
    </nav>
  </header>

  <!-- ── Input Panel ── -->
  <div class="panel panel-input">
    <div class="panel-header">
      <span class="panel-title">① ホットペッパー本文を貼る</span>
    </div>
    <div class="input-body">
      <textarea
        class="input-textarea"
        id="hp-input"
        placeholder="ホットペッパービューティーのサロンページを全選択してここに貼り付けてください。&#10;&#10;解析ボタンを押すと自動で情報を抽出してLPを生成します。"
        spellcheck="false"
      ></textarea>
      <div class="input-actions">
        <button
          class="btn btn-primary-admin"
          id="btn-parse"
          type="button"
          title="①の全文を解析して②フォームと③プレビューに反映します"
        >
          解析する
        </button>
        <button
          class="btn btn-secondary-admin"
          id="btn-apply"
          type="button"
          title="②の編集内容で③を再描画。①だけ入っているときは取り込みを試みます"
        >
          反映する
        </button>
      </div>
      <div id="quick-external-links" class="quick-external-links" aria-label="外部参照リンク" hidden></div>
      <div class="parse-status" id="parse-status" role="status" aria-live="polite" aria-atomic="true"></div>
      <div class="parse-status" id="save-server-status" style="margin-top: 8px"></div>
    </div>
  </div>

  <!-- ── Editor Panel ── -->
  <div class="panel panel-editor">
    <div class="panel-header">
      <span class="panel-title">② 内容を確認・編集</span>
    </div>
    <div class="editor-body">
      <div id="editor-form">
        <div class="lp-empty" style="min-height:200px;">
          <p>解析結果がここに表示されます</p>
        </div>
      </div>
    </div>
  </div>

  <!-- ── Preview Panel ── -->
  <div class="panel panel-preview">
    <div class="panel-header">
      <span class="panel-title">③ ライブプレビュー</span>
    </div>
    <div class="preview-body">
      <div class="lp-root" id="lp-preview">
        <div class="lp-empty">
          <p>ここにLPプレビューが表示されます</p>
        </div>
      </div>
    </div>
  </div>

</div>

<script type="module">
import { buildSalonForAdminImport, SALON_NAME_PLACEHOLDER } from './parser.js';
import {
  initEditor,
  loadIntoEditor,
  getCurrentSalon,
  loadStoredSalon,
  clearStoredDraft,
  saveHpInputDraft,
  loadHpInputDraft,
  resetEditor,
  flushSalonDraft,
} from './editor.js';
import { renderLP, effectiveAddressMapUrl } from './renderer.js';

/** ①の「解析する」の直下: Google / Instagram / ホットペッパー（②の予約URL） */
function updateQuickExternalLinks() {
  const wrap = document.getElementById('quick-external-links');
  if (!wrap) return;
  wrap.innerHTML = '';
  wrap.hidden = true;
  const salon = typeof getCurrentSalon === 'function' ? getCurrentSalon() : null;
  if (!salon) return;
  const map = String(salon.addressMapUrl || '').trim();
  const ig = String(salon.instagramUrl || '').trim();
  const hp = String(salon.reserveUrl || '').trim();
  const items = [];
  if (/^https?:\/\//i.test(map)) items.push({ href: map, label: 'Googleマップ' });
  if (/^https?:\/\//i.test(ig)) items.push({ href: ig, label: 'Instagram' });
  if (/^https?:\/\//i.test(hp)) items.push({ href: hp, label: 'ホットペッパー（予約）' });
  if (!items.length) return;
  wrap.hidden = false;
  const lab = document.createElement('span');
  lab.className = 'quick-ext-label';
  lab.textContent = '参照（新しいタブ）: ';
  wrap.appendChild(lab);
  items.forEach((x, i) => {
    if (i > 0) {
      const s = document.createElement('span');
      s.className = 'quick-ext-sep';
      s.textContent = ' · ';
      wrap.appendChild(s);
    }
    const a = document.createElement('a');
    a.className = 'quick-ext-link';
    a.href = x.href;
    a.target = '_blank';
    a.rel = 'noopener noreferrer';
    a.textContent = x.label;
    wrap.appendChild(a);
  });
}

window.__beautyEditorSalonChanged = () => {
  updateQuickExternalLinks();
};

function setParseStatus(msg, kind) {
  const status = document.getElementById('parse-status');
  if (!status) return;
  status.textContent = msg || '';
  status.className = 'parse-status' + (kind ? ' ' + kind : '');
  try {
    status.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  } catch {
    /* ignore */
  }
}

/** template-worker.html と同じ相対パス（サイト直下の /api へ届く） */
function apiBase() {
  const p = location.pathname.indexOf('/admin/');
  if (p >= 0) return location.pathname.slice(0, p) + '/api';
  return '/api';
}

function previewPublicUrl(customizationId) {
  const id = String(customizationId || '').trim();
  if (!id) return '';
  return location.origin.replace(/\/$/, '') + apiBase() + '/template-preview/' + encodeURIComponent(id);
}

/**
 * 管理者 API（JSON）。401 や HTML 404 も本文を拾ってメッセージにする。
 */
async function fetchAdminJson(path, opts = {}) {
  const url = apiBase() + path;
  const headers = { ...(opts.headers || {}) };
  if (opts.body && typeof opts.body === 'string' && !headers['Content-Type']) {
    headers['Content-Type'] = 'application/json';
  }
  const ctrl = new AbortController();
  const timeoutMs = 28000;
  const tid = setTimeout(() => ctrl.abort(), timeoutMs);
  let r;
  try {
    r = await fetch(url, {
      credentials: 'include',
      ...opts,
      headers,
      signal: ctrl.signal,
    });
  } catch (e) {
    if (e && e.name === 'AbortError') {
      throw new Error('通信がタイムアウトしました（' + timeoutMs / 1000 + '秒）。ページは操作できますが、サーバー読み込みは後から再試行してください。');
    }
    throw e;
  } finally {
    clearTimeout(tid);
  }
  const text = await r.text();
  let j = null;
  if (text) {
    try {
      j = JSON.parse(text);
    } catch {
      j = null;
    }
  }
  if (!r.ok) {
    const msg =
      (j && (j.error || j.message)) ||
      (text && String(text).trim().replace(/\s+/g, ' ').slice(0, 280)) ||
      r.status + ' ' + r.statusText;
    throw new Error(msg);
  }
  return j;
}

const previewEl = document.getElementById('lp-preview');
const hpInputEl = document.getElementById('hp-input');
const saveStatusEl = document.getElementById('save-server-status');

const params = new URLSearchParams(location.search || '');
let linkedDraftId = String(params.get('id') || '').trim();
const memoLeadId = String(params.get('memoLeadId') || '').trim();
let linkedDraftName = '';

function getBeautyMemoLeadIdFromUrl() {
  return String(new URLSearchParams(location.search || '').get('memoLeadId') || '').trim();
}

/** メモリード一覧（美容）から `?memoLeadId=` で開いたとき（`?id=` 併用時は id を優先） */
async function applyBeautyMemoLeadFromQuery(mid) {
  const row = await fetchAdminJson('/beauty-outreach/memo-leads/' + encodeURIComponent(mid), { method: 'GET' });
  const memoText = String(row.memo || '').trim();
  const shop = String(row.shopName || '').trim();
  const hpText = memoText || (shop ? `店名: ${shop}\n\n（メモ本文なし）` : '');
  if (hpInputEl) hpInputEl.value = hpText;
  saveHpInputDraft(hpInputEl ? hpInputEl.value : hpText);
  const salon = buildSalonForAdminImport(hpText || '\n');
  if (shop && (!String(salon.name || '').trim() || salon.name === SALON_NAME_PLACEHOLDER)) {
    salon.name = shop.slice(0, 80);
  }
  const mapU = String(row.addressMapUrl || '').trim().slice(0, 2000);
  const igU = String(row.instagramUrl || '').trim().slice(0, 2000);
  const hpU = String(row.hotPepperUrl || '').trim().slice(0, 2000);
  /** メモ一覧の3 URL を②の該当欄へそのまま反映（空も上書きして解析結果の残骸を消す） */
  salon.addressMapUrl = mapU;
  salon.instagramUrl = igU;
  salon.reserveUrl = hpU;
  /** 空欄時は予約URLと同じ扱いになるよう、一覧から入るときはスタイリスト一覧URLを明示的に空に */
  salon.staffListUrl = '';
  loadIntoEditor(salon);
  setSaveStatus(
    'メモリード（美容）から読み込みました。一覧の Googleマップ／Instagram／ホットペッパー（予約）URLは②の該当欄へ反映済みです。① の本文を編集したあと「解析する」で取り直せます。',
    'hint',
  );
}

function setSaveStatus(msg, kind) {
  if (!saveStatusEl) return;
  saveStatusEl.textContent = msg || '';
  saveStatusEl.className = 'parse-status' + (kind ? ' ' + kind : '');
}

const BEAUTY_OPEN_COMPAT_BASES = {
  beauty_standalone: true,
  beauty_salon_mellow: true,
  beauty_salon_hpb: true,
};

async function loadDraftFromServer(id) {
  const j = await fetchAdminJson('/template-customizations', { method: 'GET' });
  const list = Array.isArray(j) ? j : [];
  const item = list.find((x) => x && x.id === id);
  if (!item) throw new Error('指定 id のドラフトが見つかりません');
  const base = String(item.baseTemplateId || '').trim();
  if (!BEAUTY_OPEN_COMPAT_BASES[base]) {
    throw new Error('このドラフトは美容室向けではありません（base: ' + (base || '—') + '）');
  }
  linkedDraftName = String(item.name || '').trim();
  const salon = item.override && item.override.beautyStandaloneSalon;
  if (salon && typeof salon === 'object' && salon.name) {
    loadIntoEditor(salon);
  } else if (base !== 'beauty_standalone') {
    setSaveStatus(
      'ドラフト base: ' +
        base +
        '。① にホットペッパー全文を貼り「解析する」で取り込み、「サーバーに保存」で独立版に移行できます。',
      'hint',
    );
    return;
  }
  setSaveStatus(
    'サーバーからドラフトを読み込みました（' +
      id +
      (linkedDraftName ? '／' + linkedDraftName : '') +
      '）。共有プレビュー: ' +
      previewPublicUrl(id),
    'hint',
  );
}

function showFatalParse(msg) {
  const el = document.getElementById('parse-status');
  if (el) {
    el.textContent = msg;
    el.className = 'parse-status error';
  } else {
    document.body.insertAdjacentHTML(
      'afterbegin',
      `<div style="margin:12px;padding:12px;border:1px solid #c9a09a;background:#f5e0dc;font-size:14px;">${msg}</div>`,
    );
  }
}

if (previewEl) {
  initEditor(previewEl);
} else {
  showFatalParse('初期化エラー: #lp-preview がありません。');
}

if (hpInputEl) {
  hpInputEl.addEventListener('input', () => saveHpInputDraft(hpInputEl.value));
} else {
  showFatalParse('初期化エラー: #hp-input がありません。');
}

window.addEventListener('pageshow', (ev) => {
  if (!ev.persisted || !hpInputEl) return;
  const s = loadStoredSalon();
  if (s) loadIntoEditor(s);
  hpInputEl.value = loadHpInputDraft();
});

function bindParseApply() {
  const btnParse = document.getElementById('btn-parse');
  const btnApply = document.getElementById('btn-apply');
  const hpEl = document.getElementById('hp-input');

  if (btnParse && hpEl) {
    btnParse.addEventListener('click', () => {
      const text = hpEl.value.trim();
      if (!text) {
        setParseStatus('テキストを入力してください', 'error');
        return;
      }
      btnParse.disabled = true;
      btnParse.classList.add('is-busy');
      btnParse.setAttribute('aria-busy', 'true');
      setParseStatus('取り込み中…', 'notice');
      const run = () => {
        try {
          const salon = buildSalonForAdminImport(text);
          loadIntoEditor(salon);
          saveHpInputDraft(hpEl.value);
          setParseStatus(
            `①→②→③に反映しました。紹介文に全文（最大約5万文字）を入れています。店名: ${salon.name}`,
            'notice',
          );
        } catch (e) {
          console.error(e);
          setParseStatus('反映エラー: ' + (e && e.message ? e.message : String(e)), 'error');
        } finally {
          btnParse.disabled = false;
          btnParse.classList.remove('is-busy');
          btnParse.removeAttribute('aria-busy');
        }
      };
      setTimeout(run, 0);
    });
  } else {
    showFatalParse('「解析する」ボタンまたは #hp-input が見つかりません。');
  }

  if (btnApply && hpEl && previewEl) {
    btnApply.addEventListener('click', () => {
      const hpRaw = hpEl.value.trim();
      let salon = getCurrentSalon();
      btnApply.disabled = true;
      btnApply.classList.add('is-busy');
      btnApply.setAttribute('aria-busy', 'true');
      const run = () => {
        try {
          if ((!salon || !String(salon.name || '').trim()) && hpRaw) {
            loadIntoEditor(buildSalonForAdminImport(hpRaw));
            saveHpInputDraft(hpEl.value);
            setParseStatus('①の内容を②・③に取り込みました。', 'notice');
            return;
          }
          if (!salon || !String(salon.name || '').trim()) {
            setParseStatus('①が空です。本文を貼ってから「解析する」か「反映する」を押してください。', 'error');
            return;
          }
          renderLP(salon, previewEl);
          saveHpInputDraft(hpEl.value);
          flushSalonDraft();
          setParseStatus('②の内容で③を更新しました。', 'notice');
        } catch (e) {
          console.error(e);
          setParseStatus('反映エラー: ' + (e && e.message ? e.message : String(e)), 'error');
        } finally {
          btnApply.disabled = false;
          btnApply.classList.remove('is-busy');
          btnApply.removeAttribute('aria-busy');
        }
      };
      setTimeout(run, 0);
    });
  } else {
    showFatalParse('「反映する」ボタン・#hp-input・#lp-preview のいずれかが見つかりません。');
  }
}

bindParseApply();

async function bootFromServerAsync() {
  try {
    if (linkedDraftId) {
      await loadDraftFromServer(linkedDraftId);
      if (hpInputEl) hpInputEl.value = loadHpInputDraft();
    } else if (memoLeadId) {
      await applyBeautyMemoLeadFromQuery(memoLeadId);
    } else {
      if (hpInputEl) hpInputEl.value = loadHpInputDraft();
      const savedSalon = loadStoredSalon();
      if (savedSalon) loadIntoEditor(savedSalon);
    }
  } catch (e) {
    console.error(e);
    setSaveStatus(String(e.message || e), 'error');
    if (hpInputEl) hpInputEl.value = loadHpInputDraft();
    const savedSalon = loadStoredSalon();
    if (savedSalon) loadIntoEditor(savedSalon);
  }
}

void bootFromServerAsync();

// ── Reset ──
const btnReset = document.getElementById('btn-reset');
if (btnReset) {
  btnReset.addEventListener('click', () => {
    if (!confirm('すべてリセットしますか？')) return;
    clearStoredDraft();
    resetEditor();
    if (hpInputEl) hpInputEl.value = '';
    const ps = document.getElementById('parse-status');
    if (ps) {
      ps.textContent = '';
      ps.className = 'parse-status';
    }
    setSaveStatus('', '');
    const ef = document.getElementById('editor-form');
    if (ef) {
      ef.innerHTML = '<div class="lp-empty" style="min-height:200px;"><p>解析結果がここに表示されます</p></div>';
    }
    if (previewEl) {
      previewEl.innerHTML = '<div class="lp-empty"><p>ここにLPプレビューが表示されます</p></div>';
    }
  });
}

// ── Server save ──
const btnSaveServer = document.getElementById('btn-save-server');
if (btnSaveServer) {
  btnSaveServer.addEventListener('click', async () => {
  const salon = getCurrentSalon();
  setSaveStatus('', '');
  if (!salon || !String(salon.name || '').trim()) {
    setSaveStatus('店名がある状態で保存してください（解析するか、サーバーから読み込んでください）', 'error');
    return;
  }
  flushSalonDraft();
  const memoFromUrl = getBeautyMemoLeadIdFromUrl();
  const memoSavePayload = memoFromUrl ? { beautyMemoLeadId: memoFromUrl } : {};
  const stripMemoLeadFromUrl = () => {
    if (!memoFromUrl) return;
    const u = new URL(location.href);
    u.searchParams.delete('memoLeadId');
    history.replaceState({}, '', u.toString());
  };
  const memoConsumedHint =
    ' メモリード一覧からは外れ、送付・フェーズ管理（美容）の案件としてのみ表示されます（送信前相当）。';
  try {
    if (linkedDraftId) {
      const j = await fetchAdminJson('/template-customizations/save', {
        method: 'POST',
        body: JSON.stringify({
          mode: 'update',
          id: linkedDraftId,
          baseTemplateId: 'beauty_standalone',
          name: String(salon.name).trim().slice(0, 80),
          override: { beautyStandaloneSalon: salon },
          ...memoSavePayload,
        }),
      });
      linkedDraftName = String(j.item && j.item.name ? j.item.name : linkedDraftName);
      const pv = previewPublicUrl(linkedDraftId);
      stripMemoLeadFromUrl();
      setSaveStatus(
        'サーバーに保存しました。共有プレビュー: ' +
          pv +
          ' ／ 送付・フェーズは上部の「送付・フェーズ管理（美容）」で確認できます。' +
          (memoFromUrl ? memoConsumedHint : ''),
        'success',
      );
      return;
    }
    if (!window.confirm('新しい店舗ドラフトとしてサーバーに作成しますか？（base: beauty_standalone）')) return;
    const j = await fetchAdminJson('/template-customizations/save', {
      method: 'POST',
      body: JSON.stringify({
        mode: 'create',
        baseTemplateId: 'beauty_standalone',
        name: String(salon.name).trim().slice(0, 80),
        override: { beautyStandaloneSalon: salon },
        ...memoSavePayload,
      }),
    });
    const newId = j.item && j.item.id;
    if (newId) {
      linkedDraftId = newId;
      const u = new URL(location.href);
      u.searchParams.set('id', newId);
      u.searchParams.delete('memoLeadId');
      history.replaceState({}, '', u.toString());
      const pv = previewPublicUrl(newId);
      setSaveStatus(
        '新規ドラフトを保存しました（URL に id を付けました）。共有プレビュー: ' +
          pv +
          ' ／ フェーズ一覧は「送付・フェーズ管理（美容）」で確認できます。' +
          (memoFromUrl ? memoConsumedHint : ''),
        'success',
      );
    } else {
      stripMemoLeadFromUrl();
      setSaveStatus(
        '新規店舗ドラフトを作成して保存しました。' + (memoFromUrl ? memoConsumedHint : ''),
        'success',
      );
    }
  } catch (e) {
    console.error(e);
    setSaveStatus(String(e.message || e), 'error');
  }
  });
} else {
  console.warn('[beauty-standalone] #btn-save-server が見つかりません');
}

// ── Export LP ──
const btnExport = document.getElementById('btn-export');
if (btnExport) {
  btnExport.addEventListener('click', () => {
    const salon = getCurrentSalon();
    if (!salon) {
      alert('先に「解析する」で取り込んでください');
      return;
    }
    flushSalonDraft();
    if (hpInputEl) saveHpInputDraft(hpInputEl.value);
    sessionStorage.setItem('salonLP', JSON.stringify(salon));
    window.open('lp.html', '_blank');
  });
}

</script>

</body>
</html>
