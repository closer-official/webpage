<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>美容室テンプレ（独立版）— 管理画面</title>
  <link rel="stylesheet" href="styles.css" />
</head>
<body>

<div class="app-root">

  <!-- ── Header ── -->
  <header class="app-header">
    <div>
      <h1>美容室テンプレ（独立版）</h1>
      <div class="header-sub">ホットペッパー全文 → LP 自動生成（mellowとは別管理）</div>
    </div>
    <div class="header-actions">
      <a class="btn btn-ghost-admin" href="/admin/outreach-phases-beauty.html?v=7phase">送付・フェーズ管理（美容）</a>
      <a class="btn btn-ghost-admin" href="/admin/template-worker.html">店舗ドラフト編集（cafe）</a>
      <button class="btn btn-primary-admin" id="btn-save-server" type="button">サーバーに保存</button>
      <button class="btn btn-ghost-admin" id="btn-json" type="button">JSON を見る</button>
      <button class="btn btn-secondary-admin" id="btn-reset" type="button">リセット</button>
      <button class="btn btn-primary-admin" id="btn-export" type="button">LP を開く →</button>
    </div>
    <p id="draft-server-hint" class="header-sub" style="margin-top: 8px; max-width: 52rem"></p>
  </header>

  <!-- ── Input Panel ── -->
  <div class="panel panel-input">
    <div class="panel-header">
      <span class="panel-title">① ホットペッパー本文を貼る</span>
    </div>
    <div class="input-body">
      <textarea
        class="input-textarea"
        id="hp-input"
        placeholder="ホットペッパービューティーのサロンページを全選択してここに貼り付けてください。&#10;&#10;解析ボタンを押すと自動で情報を抽出してLPを生成します。"
        spellcheck="false"
      ></textarea>
      <div class="input-actions">
        <button class="btn btn-primary-admin" id="btn-parse">解析する</button>
        <button class="btn btn-secondary-admin" id="btn-apply">反映する</button>
      </div>
      <div class="parse-status" id="parse-status"></div>
    </div>
  </div>

  <!-- ── Editor Panel ── -->
  <div class="panel panel-editor">
    <div class="panel-header">
      <span class="panel-title">② 内容を確認・編集</span>
    </div>
    <div class="editor-body">
      <div id="editor-form">
        <div class="lp-empty" style="min-height:200px;">
          <p>解析結果がここに表示されます</p>
        </div>
      </div>
    </div>
  </div>

  <!-- ── Preview Panel ── -->
  <div class="panel panel-preview">
    <div class="panel-header">
      <span class="panel-title">③ ライブプレビュー</span>
    </div>
    <div class="preview-body">
      <div class="lp-root" id="lp-preview">
        <div class="lp-empty">
          <p>ここにLPプレビューが表示されます</p>
        </div>
      </div>
    </div>
  </div>

</div>

<!-- ── JSON Modal ── -->
<div class="json-modal" id="json-modal">
  <div class="json-modal-inner" id="json-content"></div>
  <div class="json-modal-close" onclick="document.getElementById('json-modal').classList.remove('open')">× 閉じる</div>
</div>

<script type="module">
import { parseHotpepper } from './parser.js';
import {
  initEditor,
  loadIntoEditor,
  getCurrentSalon,
  loadStoredSalon,
  clearStoredDraft,
  saveHpInputDraft,
  loadHpInputDraft,
  resetEditor,
  flushSalonDraft,
} from './editor.js';
import { renderLP } from './renderer.js';

/** template-worker.html と同じ相対パス（サイト直下の /api へ届く） */
function apiBase() {
  const p = location.pathname.indexOf('/admin/');
  if (p >= 0) return location.pathname.slice(0, p) + '/api';
  return '/api';
}

function previewPublicUrl(customizationId) {
  const id = String(customizationId || '').trim();
  if (!id) return '';
  return location.origin.replace(/\/$/, '') + apiBase() + '/template-preview/' + encodeURIComponent(id);
}

/**
 * 管理者 API（JSON）。401 や HTML 404 も本文を拾ってメッセージにする。
 */
async function fetchAdminJson(path, opts = {}) {
  const url = apiBase() + path;
  const headers = { ...(opts.headers || {}) };
  if (opts.body && typeof opts.body === 'string' && !headers['Content-Type']) {
    headers['Content-Type'] = 'application/json';
  }
  const r = await fetch(url, { credentials: 'include', ...opts, headers });
  const text = await r.text();
  let j = null;
  if (text) {
    try {
      j = JSON.parse(text);
    } catch {
      j = null;
    }
  }
  if (!r.ok) {
    const msg =
      (j && (j.error || j.message)) ||
      (text && String(text).trim().replace(/\s+/g, ' ').slice(0, 280)) ||
      r.status + ' ' + r.statusText;
    throw new Error(msg);
  }
  return j;
}

const previewEl = document.getElementById('lp-preview');
const hpInputEl = document.getElementById('hp-input');
const saveStatusEl = document.getElementById('save-server-status');
const draftHintEl = document.getElementById('draft-server-hint');

const params = new URLSearchParams(location.search || '');
let linkedDraftId = String(params.get('id') || '').trim();
let linkedDraftName = '';

function setSaveStatus(msg, kind) {
  saveStatusEl.textContent = msg || '';
  saveStatusEl.className = 'parse-status' + (kind ? ' ' + kind : '');
}

const BEAUTY_OPEN_COMPAT_BASES = {
  beauty_standalone: true,
  beauty_salon_mellow: true,
  beauty_salon_hpb: true,
};

async function loadDraftFromServer(id) {
  const j = await fetchAdminJson('/template-customizations', { method: 'GET' });
  const list = Array.isArray(j) ? j : [];
  const item = list.find((x) => x && x.id === id);
  if (!item) throw new Error('指定 id のドラフトが見つかりません');
  const base = String(item.baseTemplateId || '').trim();
  if (!BEAUTY_OPEN_COMPAT_BASES[base]) {
    throw new Error('このドラフトは美容室向けではありません（base: ' + (base || '—') + '）');
  }
  linkedDraftName = String(item.name || '').trim();
  const salon = item.override && item.override.beautyStandaloneSalon;
  if (salon && typeof salon === 'object' && salon.name) {
    loadIntoEditor(salon);
  } else if (base !== 'beauty_standalone') {
    draftHintEl.textContent =
      'ドラフト base: ' +
      base +
      '。独立版用データ（beautyStandaloneSalon）がまだありません。下の①にホットペッパー全文を貼り「解析する」で取り込んでから保存すると、独立版に移行できます。';
    return;
  }
  draftHintEl.textContent =
    'サーバー連携ドラフト ID: ' +
    id +
    (linkedDraftName ? '（登録名: ' + linkedDraftName + '）' : '') +
    '。共有用プレビュー: ' +
    previewPublicUrl(id) +
    ' ／ 送付・フェーズは「送付・フェーズ管理（美容）」（/admin/outreach-phases-beauty.html）から。';
}

initEditor(previewEl);

hpInputEl.addEventListener('input', () => {
  saveHpInputDraft(hpInputEl.value);
});

window.addEventListener('pageshow', (ev) => {
  if (!ev.persisted) return;
  const s = loadStoredSalon();
  if (s) loadIntoEditor(s);
  hpInputEl.value = loadHpInputDraft();
});

try {
  if (linkedDraftId) {
    await loadDraftFromServer(linkedDraftId);
    hpInputEl.value = loadHpInputDraft();
  } else {
    draftHintEl.textContent =
      'URL に ?id=店舗ドラフトID があるときサーバーへ保存できます。未指定のときは「サーバーに保存」で新規ドラフトを作成し、URL に id を付けます。';
    hpInputEl.value = loadHpInputDraft();
    const savedSalon = loadStoredSalon();
    if (savedSalon) loadIntoEditor(savedSalon);
  }
} catch (e) {
  console.error(e);
  draftHintEl.textContent = String(e.message || e);
  hpInputEl.value = loadHpInputDraft();
  const savedSalon = loadStoredSalon();
  if (savedSalon) loadIntoEditor(savedSalon);
}

// ── Parse ──
document.getElementById('btn-parse').addEventListener('click', () => {
  const text = document.getElementById('hp-input').value.trim();
  const status = document.getElementById('parse-status');

  if (!text) {
    status.textContent = 'テキストを入力してください';
    status.className = 'parse-status error';
    return;
  }

  try {
    const salon = parseHotpepper(text);
    if (!salon.name) {
      status.textContent = '店名を抽出できませんでした。ホットペッパーの全文が含まれているか確認してください。';
      status.className = 'parse-status error';
      return;
    }
    loadIntoEditor(salon);
    status.textContent = `✓ 解析完了 — ${salon.name} ／ クーポン${salon.coupons.length}件 ／ スタッフ${salon.staff.length}人 ／ こだわり${salon.features.length}件`;
    status.className = 'parse-status success';
  } catch (e) {
    console.error(e);
    status.textContent = `解析エラー: ${e.message}`;
    status.className = 'parse-status error';
  }
});

// ── Apply (re-render from current editor state) ──
document.getElementById('btn-apply').addEventListener('click', () => {
  const salon = getCurrentSalon();
  if (salon) renderLP(salon, previewEl);
});

// ── JSON modal ──
document.getElementById('btn-json').addEventListener('click', () => {
  const salon = getCurrentSalon();
  document.getElementById('json-content').textContent = JSON.stringify(salon, null, 2);
  document.getElementById('json-modal').classList.add('open');
});

// ── Reset ──
document.getElementById('btn-reset').addEventListener('click', () => {
  if (!confirm('すべてリセットしますか？')) return;
  clearStoredDraft();
  resetEditor();
  hpInputEl.value = '';
  document.getElementById('parse-status').className = 'parse-status';
  setSaveStatus('', '');
  document.getElementById('editor-form').innerHTML = '<div class="lp-empty" style="min-height:200px;"><p>解析結果がここに表示されます</p></div>';
  previewEl.innerHTML = '<div class="lp-empty"><p>ここにLPプレビューが表示されます</p></div>';
});

// ── Server save ──
document.getElementById('btn-save-server').addEventListener('click', async () => {
  const salon = getCurrentSalon();
  setSaveStatus('', '');
  if (!salon || !String(salon.name || '').trim()) {
    setSaveStatus('店名がある状態で保存してください（解析するか、サーバーから読み込んでください）', 'error');
    return;
  }
  flushSalonDraft();
  try {
    if (linkedDraftId) {
      const j = await fetchAdminJson('/template-customizations/save', {
        method: 'POST',
        body: JSON.stringify({
          mode: 'update',
          id: linkedDraftId,
          baseTemplateId: 'beauty_standalone',
          name: String(salon.name).trim().slice(0, 80),
          override: { beautyStandaloneSalon: salon },
        }),
      });
      linkedDraftName = String(j.item && j.item.name ? j.item.name : linkedDraftName);
      setSaveStatus('サーバーに保存しました（店舗ドラフトを更新し、未登録ならフェーズ用一覧に1件追加します）。', 'success');
      const pv = previewPublicUrl(linkedDraftId);
      draftHintEl.textContent =
        'ドラフト ID: ' +
        linkedDraftId +
        (linkedDraftName ? '（登録名: ' + linkedDraftName + '）' : '') +
        ' ／ 共有プレビューURL: ' +
        pv +
        ' ／ 送付・フェーズ: 上部「送付・フェーズ管理（美容）」（/admin/outreach-phases-beauty.html）から。';
      return;
    }
    if (!window.confirm('新しい店舗ドラフトとしてサーバーに作成しますか？（base: beauty_standalone）')) return;
    const j = await fetchAdminJson('/template-customizations/save', {
      method: 'POST',
      body: JSON.stringify({
        mode: 'create',
        baseTemplateId: 'beauty_standalone',
        name: String(salon.name).trim().slice(0, 80),
        override: { beautyStandaloneSalon: salon },
      }),
    });
    const newId = j.item && j.item.id;
    if (newId) {
      linkedDraftId = newId;
      const u = new URL(location.href);
      u.searchParams.set('id', newId);
      history.replaceState({}, '', u.toString());
      const pv = previewPublicUrl(newId);
      draftHintEl.textContent =
        '新規ドラフト ID: ' +
        newId +
        '（このタブの URL に id が付きました。ブックマーク推奨） ／ 共有プレビュー: ' +
        pv +
        ' ／ 送付・フェーズ一覧（美容専用）に自動で1件追加されます（上部「送付・フェーズ管理（美容）」で確認）。';
    }
    setSaveStatus('新規店舗ドラフトを作成して保存しました。', 'success');
  } catch (e) {
    console.error(e);
    setSaveStatus(String(e.message || e), 'error');
  }
});

// ── Export LP ──
document.getElementById('btn-export').addEventListener('click', () => {
  const salon = getCurrentSalon();
  if (!salon) {
    alert('先に解析してください');
    return;
  }
  flushSalonDraft();
  saveHpInputDraft(hpInputEl.value);
  sessionStorage.setItem('salonLP', JSON.stringify(salon));
  window.open('lp.html', '_blank');
});

// ── JSON modal close on backdrop ──
document.getElementById('json-modal').addEventListener('click', (e) => {
  if (e.target === e.currentTarget) e.currentTarget.classList.remove('open');
});
</script>

</body>
</html>
