<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="robots" content="noindex, nofollow" />
    <title>送付・フェーズ分析 | Closer</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js" crossorigin="anonymous"></script>
    <style>
      :root {
        --bg: #0c1220;
        --panel: #141c2e;
        --text: #e8edf5;
        --muted: #9aacbf;
        --border: #2a3a55;
        --err: #f87171;
        --accent: #38bdf8;
        --chart-h: 300px;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.5;
      }
      .nav {
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        padding: 12px 20px;
        border-bottom: 1px solid var(--border);
        background: rgba(12, 18, 32, 0.95);
      }
      .nav a {
        color: var(--muted);
        text-decoration: none;
        font-size: 0.9rem;
      }
      .nav a:hover {
        color: var(--text);
      }
      main {
        max-width: 1280px;
        margin: 0 auto;
        padding: 24px 20px 80px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.35rem;
      }
      .sub {
        margin: 0 0 20px;
        color: var(--muted);
        font-size: 0.9rem;
        max-width: 52rem;
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 16px 18px;
        margin-bottom: 18px;
      }
      .panel h2 {
        margin: 0 0 4px;
        font-size: 1rem;
        color: #bae6fd;
        font-weight: 650;
      }
      .panel .hint {
        margin: 0 0 12px;
        font-size: 0.78rem;
        color: var(--muted);
      }
      .filters {
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(160px, 1fr));
        gap: 12px 16px;
        align-items: end;
      }
      label {
        display: block;
        font-size: 0.75rem;
        color: var(--muted);
        margin-bottom: 4px;
      }
      input,
      select {
        width: 100%;
        padding: 8px 10px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: #0c1528;
        color: var(--text);
        font-size: 0.88rem;
      }
      .btn {
        display: inline-flex;
        align-items: center;
        justify-content: center;
        min-height: 38px;
        padding: 0 16px;
        border-radius: 8px;
        border: 1px solid #0e7490;
        background: #0c4a6e;
        color: #e0f2fe;
        font-weight: 600;
        font-size: 0.86rem;
        cursor: pointer;
      }
      .btn:hover {
        border-color: var(--accent);
        color: #fff;
      }
      .summary {
        display: flex;
        flex-wrap: wrap;
        gap: 14px 22px;
        font-size: 0.9rem;
        align-items: center;
      }
      .summary strong {
        color: var(--accent);
        font-weight: 700;
      }
      .err {
        color: var(--err);
        margin: 0 0 12px;
        font-size: 0.9rem;
      }
      .chart-grid {
        display: grid;
        grid-template-columns: 1fr;
        gap: 18px;
      }
      @media (min-width: 960px) {
        .chart-grid.two {
          grid-template-columns: 1fr 1fr;
        }
      }
      .chart-wrap {
        position: relative;
        height: var(--chart-h);
        max-height: min(42vh, 360px);
      }
      .chart-wrap.tall {
        --chart-h: 340px;
        max-height: min(48vh, 400px);
      }
      .chart-wrap.wide-y {
        height: auto;
        min-height: 280px;
        max-height: none;
      }
      details.raw-log {
        margin-top: 8px;
      }
      details.raw-log > summary {
        cursor: pointer;
        color: var(--muted);
        font-size: 0.88rem;
        user-select: none;
      }
      details.raw-log > summary:hover {
        color: var(--text);
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.78rem;
        margin-top: 10px;
      }
      th,
      td {
        border-bottom: 1px solid var(--border);
        padding: 6px 5px;
        text-align: left;
        vertical-align: top;
      }
      th {
        color: var(--muted);
        font-weight: 600;
        white-space: nowrap;
      }
      .mono {
        font-family: ui-monospace, Consolas, monospace;
        font-size: 0.76rem;
      }
      .pill {
        display: inline-block;
        padding: 2px 8px;
        border-radius: 999px;
        font-size: 0.7rem;
        font-weight: 600;
      }
      .pill-sent {
        background: #14532d;
        color: #bbf7d0;
      }
      .pill-phase {
        background: #1e3a5f;
        color: #bae6fd;
      }
      .empty-charts {
        color: var(--muted);
        font-size: 0.9rem;
        padding: 12px 0;
      }
    </style>
  </head>
  <body>
    <nav class="nav" aria-label="ナビ">
      <a href="../">← 運営トップ</a>
      <a href="./outreach-phases.html?v=7phase">飲食・その他フェーズ</a>
      <a href="./outreach-phases-beauty.html?v=7phase">美容室フェーズ</a>
    </nav>
    <main>
      <h1>送付・フェーズ分析</h1>
      <p class="sub">
        <strong>テンプレ別・時間帯・曜日・DMパターン</strong>などの<strong>分布</strong>を棒グラフで見る画面です（日付の折れ線グラフは置いていません）。集計はフィルタ後の<strong>全ログ件数</strong>に対してサーバー側で行います。生ログ表は最大2000件までです。
      </p>
      <p id="err" class="err" style="display: none"></p>
      <div class="panel">
        <h2>絞り込み</h2>
        <p class="hint">期間は「その範囲だけ集計」用です。メインの見方はグラフの形（どのテンプレ・何時に操作が集中したか）です。</p>
        <div class="filters">
          <div>
            <label for="f-from">期間・開始（任意）</label>
            <input type="datetime-local" id="f-from" />
          </div>
          <div>
            <label for="f-to">期間・終了（任意）</label>
            <input type="datetime-local" id="f-to" />
          </div>
          <div>
            <label for="f-pool">保存先</label>
            <select id="f-pool">
              <option value="">すべて</option>
              <option value="beauty">美容ダッシュ</option>
              <option value="main">メインダッシュ</option>
            </select>
          </div>
          <div>
            <label for="f-seg">区分</label>
            <select id="f-seg">
              <option value="">すべて</option>
              <option value="1">美容室寄り行のみ</option>
              <option value="0">飲食寄り行のみ</option>
            </select>
          </div>
          <div>
            <label for="f-tpl">templateId 完全一致（任意）</label>
            <input type="text" id="f-tpl" placeholder="1テンプレに絞るとき" maxlength="80" />
          </div>
          <div>
            <label>&nbsp;</label>
            <button type="button" class="btn" id="btn-load">再読み込み</button>
          </div>
        </div>
      </div>
      <div class="panel summary" id="summary" style="display: none"></div>
      <div id="charts-root">
        <p class="empty-charts">読み込み中…</p>
      </div>
      <details class="raw-log">
        <summary>生ログ（表・最大2000件）</summary>
        <div class="panel" style="overflow-x: auto; margin-top: 10px; border: none; padding: 0">
          <table>
            <thead>
              <tr>
                <th>時刻</th>
                <th>種別</th>
                <th>担当</th>
                <th>店名</th>
                <th>template</th>
                <th>DM</th>
                <th>保存先</th>
                <th>詳細</th>
              </tr>
            </thead>
            <tbody id="tbody">
              <tr>
                <td colspan="8">—</td>
              </tr>
            </tbody>
          </table>
        </div>
      </details>
    </main>
    <script>
      (function () {
        if (typeof Chart === 'undefined') {
          document.getElementById('err').textContent =
            'Chart.js の読み込みに失敗しました。ネットワークまたは CDN を確認してください。';
          document.getElementById('err').style.display = 'block';
          return;
        }

        Chart.defaults.color = '#9aacbf';
        Chart.defaults.borderColor = 'rgba(42, 58, 85, 0.9)';
        Chart.defaults.font.family = "system-ui, -apple-system, 'Segoe UI', sans-serif";

        var api = '';
        try {
          api = new URLSearchParams(location.search).get('api') || '';
        } catch (e) {}
        if (!api) api = '';

        var chartList = [];

        function qs(sel) {
          return document.querySelector(sel);
        }

        function credFetch(url, opts) {
          return fetch(url, Object.assign({ credentials: 'include' }, opts || {}));
        }

        function buildQuery() {
          var p = [];
          var fromEl = qs('#f-from');
          var toEl = qs('#f-to');
          var pool = String(qs('#f-pool').value || '').trim();
          var seg = String(qs('#f-seg').value || '').trim();
          var tpl = String(qs('#f-tpl').value || '').trim();
          if (fromEl && fromEl.value) p.push('from=' + encodeURIComponent(fromEl.value));
          if (toEl && toEl.value) p.push('to=' + encodeURIComponent(toEl.value));
          if (pool) p.push('storagePool=' + encodeURIComponent(pool));
          if (seg) p.push('segmentBeauty=' + encodeURIComponent(seg));
          if (tpl) p.push('templateId=' + encodeURIComponent(tpl));
          return p.length ? '?' + p.join('&') : '';
        }

        function esc(s) {
          return String(s == null ? '' : s)
            .split('&')
            .join('&amp;')
            .split('<')
            .join('&lt;')
            .split('>')
            .join('&gt;');
        }

        function destroyCharts() {
          chartList.forEach(function (c) {
            try {
              c.destroy();
            } catch (e) {}
          });
          chartList = [];
        }

        function barColors(n, alpha) {
          var a = alpha == null ? 0.75 : alpha;
          var base = [
            [56, 189, 248],
            [52, 211, 153],
            [251, 191, 36],
            [167, 139, 250],
            [251, 113, 133],
            [94, 234, 212],
            [147, 197, 253],
            [253, 186, 116],
          ];
          var out = [];
          for (var i = 0; i < n; i++) {
            var b = base[i % base.length];
            out.push('rgba(' + b[0] + ',' + b[1] + ',' + b[2] + ',' + a + ')');
          }
          return out;
        }

        function makePanel(title, hint, canvasId, tall, wideY) {
          var h2 = document.createElement('h2');
          h2.textContent = title;
          var p = document.createElement('p');
          p.className = 'hint';
          p.textContent = hint || '';
          var wrap = document.createElement('div');
          wrap.className = 'chart-wrap' + (tall ? ' tall' : '') + (wideY ? ' wide-y' : '');
          var cv = document.createElement('canvas');
          cv.id = canvasId;
          cv.setAttribute('role', 'img');
          wrap.appendChild(cv);
          var panel = document.createElement('div');
          panel.className = 'panel';
          panel.appendChild(h2);
          if (hint) panel.appendChild(p);
          panel.appendChild(wrap);
          return { panel: panel, canvas: cv };
        }

        function renderTable(rows) {
          var tb = qs('#tbody');
          if (!rows.length) {
            tb.innerHTML = '<tr><td colspan="8">該当するイベントがありません。</td></tr>';
            return;
          }
          tb.innerHTML = rows
            .map(function (e) {
              var typ = String(e.type || '');
              var pill =
                typ === 'message_sent'
                  ? '<span class="pill pill-sent">送信済み</span>'
                  : '<span class="pill pill-phase">フェーズ</span>';
              var det =
                typ === 'message_sent'
                  ? esc(e.fromStatus) + '→' + esc(e.toStatus) + ' / ' + esc(e.phase)
                  : esc(e.fromPhase) + '→' + esc(e.toPhase);
              return (
                '<tr>' +
                '<td class="mono">' +
                esc(e.at) +
                '</td>' +
                '<td>' +
                pill +
                '</td>' +
                '<td>' +
                esc(e.actorName) +
                '</td>' +
                '<td>' +
                esc(e.shopName) +
                '</td>' +
                '<td class="mono">' +
                esc(e.templateId) +
                '</td>' +
                '<td>' +
                esc(e.outreachDmPattern) +
                '</td>' +
                '<td>' +
                esc(e.storagePool) +
                '</td>' +
                '<td class="mono">' +
                det +
                '</td>' +
                '</tr>'
              );
            })
            .join('');
        }

        function setHBarHeight(panelEl, rowCount) {
          var wrap = panelEl.querySelector('.chart-wrap');
          if (!wrap || !rowCount) return;
          var px = Math.min(900, Math.max(220, 48 + rowCount * 26));
          wrap.style.height = px + 'px';
        }

        function renderCharts(agg) {
          destroyCharts();
          var root = qs('#charts-root');
          root.innerHTML = '';
          if (!agg) {
            root.innerHTML =
              '<div class="panel"><p class="empty-charts">集計データがありません。</p></div>';
            return;
          }
          var nSend = Number(agg.messageSentCount) || 0;
          var nPhase = Number(agg.phaseChangeCount) || 0;
          if (!nSend && !nPhase) {
            root.innerHTML =
              '<div class="panel"><p class="empty-charts">まだイベントがありません。フェーズ画面で送信済み／フェーズ変更を行うとここに溜まります。</p></div>';
            return;
          }

          if (!nSend) {
            var info = document.createElement('div');
            info.className = 'panel';
            info.innerHTML =
              '<p class="empty-charts" style="margin:0">送信済み操作のログが0件のため、<strong>テンプレ・時間帯・曜日・DMパターン</strong>のグラフは出しません。フェーズ変更のグラフのみ表示します。</p>';
            root.appendChild(info);
          }

          if (nSend) {
          var grid1 = document.createElement('div');
          grid1.className = 'chart-grid two';

          var tpl = makePanel(
            'テンプレ別（templateId）',
            '送信済み操作の件数。どの LP テンプレ経由の案件で送っているかの偏りを見る用途です。',
            'ch-template',
            false,
            true,
          );
          var labelsT = (agg.byTemplate || []).map(function (x) {
            return x.key.length > 42 ? x.key.slice(0, 40) + '…' : x.key;
          });
          var dataT = (agg.byTemplate || []).map(function (x) {
            return x.count;
          });
          setHBarHeight(tpl.panel, labelsT.length);
          chartList.push(
            new Chart(tpl.canvas.getContext('2d'), {
              type: 'bar',
              data: {
                labels: labelsT,
                datasets: [
                  {
                    label: '送信済み操作（件）',
                    data: dataT,
                    backgroundColor: barColors(labelsT.length),
                    borderWidth: 0,
                  },
                ],
              },
              options: {
                indexAxis: 'y',
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                  x: { beginAtZero: true, ticks: { precision: 0 } },
                  y: { ticks: { autoSkip: false, font: { size: 11 } } },
                },
              },
            }),
          );
          grid1.appendChild(tpl.panel);

          var hr = makePanel(
            '時間帯別（日本時間・時）',
            '送信済み操作を押した時刻の「時」0–23 の分布。狙い目の時間帯の探索用です。',
            'ch-hour',
            false,
            false,
          );
          var labelsH = (agg.byHourJst || []).map(function (x) {
            return String(x.hour);
          });
          var dataH = (agg.byHourJst || []).map(function (x) {
            return x.count;
          });
          chartList.push(
            new Chart(hr.canvas.getContext('2d'), {
              type: 'bar',
              data: {
                labels: labelsH,
                datasets: [
                  {
                    label: '件数',
                    data: dataH,
                    backgroundColor: 'rgba(56, 189, 248, 0.75)',
                    borderWidth: 0,
                  },
                ],
              },
              options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                  x: { title: { display: true, text: '時（Asia/Tokyo）' } },
                  y: { beginAtZero: true, ticks: { precision: 0 } },
                },
              },
            }),
          );
          grid1.appendChild(hr.panel);
          root.appendChild(grid1);

          var grid2 = document.createElement('div');
          grid2.className = 'chart-grid two';

          var wd = makePanel(
            '曜日別（日本時間）',
            '月〜日の分布。週のどこに偏っているかをざっくり見る用途です。',
            'ch-wd',
            false,
            false,
          );
          var labelsW = (agg.byWeekdayJst || []).map(function (x) {
            return x.key;
          });
          var dataW = (agg.byWeekdayJst || []).map(function (x) {
            return x.count;
          });
          chartList.push(
            new Chart(wd.canvas.getContext('2d'), {
              type: 'bar',
              data: {
                labels: labelsW,
                datasets: [
                  {
                    label: '件数',
                    data: dataW,
                    backgroundColor: 'rgba(167, 139, 250, 0.78)',
                    borderWidth: 0,
                  },
                ],
              },
              options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                  y: { beginAtZero: true, ticks: { precision: 0 } },
                },
              },
            }),
          );
          grid2.appendChild(wd.panel);

          var dm = makePanel(
            'DMパターン別（1–5）',
            '送信済み操作時点で行に保存されていた outreachDmPattern の分布です。',
            'ch-dm',
            false,
            false,
          );
          var labelsD = (agg.byDmPattern || []).map(function (x) {
            return x.key;
          });
          var dataD = (agg.byDmPattern || []).map(function (x) {
            return x.count;
          });
          chartList.push(
            new Chart(dm.canvas.getContext('2d'), {
              type: 'bar',
              data: {
                labels: labelsD,
                datasets: [
                  {
                    label: '件数',
                    data: dataD,
                    backgroundColor: barColors(labelsD.length),
                    borderWidth: 0,
                  },
                ],
              },
              options: {
                responsive: true,
                maintainAspectRatio: false,
                plugins: { legend: { display: false } },
                scales: {
                  y: { beginAtZero: true, ticks: { precision: 0 } },
                },
              },
            }),
          );
          grid2.appendChild(dm.panel);
          root.appendChild(grid2);
          }

          if (nPhase > 0) {
            var ph = makePanel(
              'フェーズ変更の「移動先」',
              '明示的なフェーズ変更イベントの、toPhase ごとの件数です。',
              'ch-phase',
              true,
              true,
            );
            var labelsP = (agg.phaseChangeToPhase || []).map(function (x) {
              return x.key.length > 36 ? x.key.slice(0, 34) + '…' : x.key;
            });
            var dataP = (agg.phaseChangeToPhase || []).map(function (x) {
              return x.count;
            });
            setHBarHeight(ph.panel, labelsP.length);
            var phWrap = document.createElement('div');
            phWrap.className = 'chart-grid';
            chartList.push(
              new Chart(ph.canvas.getContext('2d'), {
                type: 'bar',
                data: {
                  labels: labelsP,
                  datasets: [
                    {
                      label: '件数',
                      data: dataP,
                      backgroundColor: 'rgba(52, 211, 153, 0.72)',
                      borderWidth: 0,
                    },
                  ],
                },
                options: {
                  indexAxis: 'y',
                  responsive: true,
                  maintainAspectRatio: false,
                  plugins: { legend: { display: false } },
                  scales: {
                    x: { beginAtZero: true, ticks: { precision: 0 } },
                    y: { ticks: { font: { size: 11 } } },
                  },
                },
              }),
            );
            phWrap.appendChild(ph.panel);
            root.appendChild(phWrap);
          }
        }

        function render(data) {
          var err = qs('#err');
          err.style.display = 'none';
          err.textContent = '';
          var sum = qs('#summary');
          if (data && data.summary) {
            sum.style.display = 'flex';
            sum.innerHTML =
              '<span>全イベント: <strong>' +
              esc(data.summary.total) +
              '</strong></span>' +
              '<span>送信済み: <strong>' +
              esc(data.summary.messageSent) +
              '</strong></span>' +
              '<span>フェーズ変更: <strong>' +
              esc(data.summary.phaseChange) +
              '</strong></span>' +
              '<span>表の行数: <strong>' +
              esc(data.summary.returned) +
              '</strong></span>';
          }
          renderCharts(data.aggregates || null);
          renderTable((data && data.events) || []);
        }

        function load() {
          var err = qs('#err');
          err.style.display = 'none';
          credFetch((api || '') + '/api/outreach/analytics-events' + buildQuery())
            .then(function (r) {
              if (r.status === 401) throw new Error('ログインが必要です。運営トップから管理者ログインしてください。');
              return r.json().then(function (j) {
                if (!r.ok) throw new Error((j && j.error) || r.statusText);
                return j;
              });
            })
            .then(render)
            .catch(function (e) {
              err.style.display = 'block';
              err.textContent = String(e.message || e);
              destroyCharts();
              qs('#charts-root').innerHTML =
                '<div class="panel"><p class="empty-charts">読み込みに失敗しました。</p></div>';
              qs('#tbody').innerHTML = '<tr><td colspan="8">—</td></tr>';
              qs('#summary').style.display = 'none';
            });
        }

        qs('#btn-load').addEventListener('click', load);
        load();
      })();
    </script>
  </body>
</html>
