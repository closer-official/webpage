<!doctype html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>メモリード一覧（フェーズ確認前） — CLOSER</title>
    <style>
      :root {
        --bg: #0c1220;
        --panel: #141c2e;
        --text: #e8edf5;
        --muted: #9aacbf;
        --accent: #3b82f6;
        --accent2: #22c55e;
        --border: #2a3a55;
        --err: #f87171;
      }
      * {
        box-sizing: border-box;
      }
      body {
        margin: 0;
        font-family: system-ui, -apple-system, 'Segoe UI', sans-serif;
        background: var(--bg);
        color: var(--text);
        line-height: 1.5;
      }
      .nav {
        position: sticky;
        top: 0;
        z-index: 10;
        display: flex;
        flex-wrap: wrap;
        gap: 10px;
        align-items: center;
        padding: 12px 20px;
        background: rgba(12, 18, 32, 0.92);
        border-bottom: 1px solid var(--border);
        backdrop-filter: blur(8px);
      }
      .nav a {
        color: var(--muted);
        text-decoration: none;
        font-size: 0.9rem;
      }
      .nav a:hover {
        color: var(--text);
      }
      .nav .btn {
        display: inline-flex;
        align-items: center;
        padding: 8px 14px;
        border-radius: 8px;
        font-size: 0.85rem;
        font-weight: 600;
        border: 1px solid var(--border);
        background: var(--panel);
        color: var(--text);
        cursor: pointer;
        text-decoration: none;
      }
      .nav .btn.primary {
        background: var(--accent);
        border-color: #2563eb;
        color: #fff;
      }
      .nav .btn.success {
        background: #14532d;
        border-color: var(--accent2);
        color: #dcfce7;
      }
      main {
        max-width: 1100px;
        margin: 0 auto;
        padding: 24px 20px 80px;
      }
      h1 {
        margin: 0 0 8px;
        font-size: 1.45rem;
        font-weight: 700;
      }
      .sub {
        margin: 0 0 24px;
        color: var(--muted);
        font-size: 0.9rem;
      }
      .panel {
        background: var(--panel);
        border: 1px solid var(--border);
        border-radius: 12px;
        padding: 18px 20px;
        margin-bottom: 20px;
      }
      .panel h2 {
        margin: 0 0 12px;
        font-size: 1rem;
      }
      label {
        display: block;
        font-size: 0.78rem;
        color: var(--muted);
        margin-bottom: 4px;
      }
      input[type='text'],
      textarea {
        width: 100%;
        padding: 10px 12px;
        border-radius: 8px;
        border: 1px solid var(--border);
        background: #0f1628;
        color: var(--text);
        font-size: 0.9rem;
      }
      textarea {
        min-height: 120px;
        resize: vertical;
        font-family: ui-monospace, monospace;
        font-size: 0.82rem;
      }
      .row-actions {
        display: flex;
        flex-wrap: wrap;
        gap: 8px;
        margin-top: 12px;
      }
      table {
        width: 100%;
        border-collapse: collapse;
        font-size: 0.82rem;
      }
      th,
      td {
        border-bottom: 1px solid var(--border);
        padding: 10px 8px;
        text-align: left;
        vertical-align: top;
      }
      th {
        color: var(--muted);
        font-weight: 600;
        font-size: 0.72rem;
        text-transform: uppercase;
        letter-spacing: 0.04em;
      }
      .memo-preview {
        max-width: 360px;
        white-space: pre-wrap;
        word-break: break-word;
        color: #cbd5e1;
      }
      .btn-sm {
        padding: 6px 10px;
        font-size: 0.75rem;
        border-radius: 6px;
        border: 1px solid var(--border);
        background: #1e293b;
        color: var(--text);
        cursor: pointer;
      }
      .btn-sm.danger {
        border-color: #7f1d1d;
        color: #fecaca;
      }
      .btn-sm.primary {
        background: var(--accent);
        border-color: #2563eb;
        color: #fff;
      }
      #err {
        display: none;
        color: var(--err);
        margin-bottom: 12px;
        font-size: 0.88rem;
      }
      #ok-msg {
        display: none;
        color: var(--accent2);
        margin-bottom: 12px;
        font-size: 0.88rem;
      }
      .mono {
        font-family: ui-monospace, monospace;
        font-size: 0.72rem;
        color: var(--muted);
      }
    </style>
  </head>
  <body>
    <nav class="nav" aria-label="メモリード・関連ページ">
      <a href="../">← 運営トップ</a>
      <a href="./outreach-phases.html?v=memo1" class="btn">送付・フェーズ管理</a>
      <a href="./template-worker.html?v=memo1" class="btn success">店舗ドラフト編集（空で開く）</a>
    </nav>
    <main>
      <h1>メモリード一覧</h1>
      <p class="sub">
        <strong>サイトがない・弱い店</strong>だけ、店名とメモ（Instagram / ホットペッパー / Googleマップ
        などのURLや覚え書き）を残す場所です。フル入力やドラフト作成の時間がないときの<strong>下書き置き場</strong>です。各行から<strong>店舗ドラフト編集</strong>へ飛ぶと、店名とメモがフォームに流し込まれます（あとから保存して案件化してください）。
      </p>
      <p id="err" role="alert"></p>
      <p id="ok-msg" aria-live="polite"></p>

      <section class="panel" aria-labelledby="add-h">
        <h2 id="add-h">新規メモを追加</h2>
        <label for="new-name">店名</label>
        <input type="text" id="new-name" maxlength="200" placeholder="例：渋谷カフェ ○○" autocomplete="off" />
        <label for="new-memo" style="margin-top: 12px">メモ（リンク・覚え書き）</label>
        <textarea id="new-memo" maxlength="12000" placeholder="例：&#10;https://www.instagram.com/...&#10;https://beauty.hotpepper.jp/...&#10;https://maps.google.com/?q=..."></textarea>
        <div class="row-actions">
          <button type="button" class="btn-sm primary" id="btn-add">追加する</button>
        </div>
      </section>

      <section class="panel" aria-labelledby="list-h">
        <h2 id="list-h">保存済みメモ</h2>
        <p class="sub" style="margin-top: 0">更新日の新しい順。行の「店舗ドラフトで編集へ」で新規モードに店名・メモを反映します。</p>
        <div id="list-wrap">読み込み中…</div>
      </section>
    </main>
    <script>
      (function () {
        var api = (function () {
          var p = location.pathname.indexOf('/admin/');
          if (p >= 0) return location.pathname.slice(0, p) + '/api';
          return '/api';
        })();

        function showErr(msg) {
          var e = document.getElementById('err');
          e.style.display = msg ? 'block' : 'none';
          e.textContent = msg || '';
        }
        function showOk(msg) {
          var e = document.getElementById('ok-msg');
          e.style.display = msg ? 'block' : 'none';
          e.textContent = msg || '';
          if (msg) setTimeout(function () { e.style.display = 'none'; }, 2400);
        }

        function credFetch(path, opts) {
          return fetch(path, Object.assign({ credentials: 'include' }, opts || {}));
        }

        function workerUrlWithMemo(id) {
          return './template-worker.html?memoLeadId=' + encodeURIComponent(id) + '&v=memo1';
        }

        function renderList(rows) {
          var w = document.getElementById('list-wrap');
          if (!rows || !rows.length) {
            w.innerHTML = '<p class="sub" style="margin:0">まだメモがありません。上のフォームから追加してください。</p>';
            return;
          }
          var tb = document.createElement('table');
          tb.innerHTML =
            '<thead><tr><th>店名</th><th>メモ</th><th>更新</th><th>操作</th></tr></thead><tbody></tbody>';
          var body = tb.querySelector('tbody');
          rows.forEach(function (r) {
            var tr = document.createElement('tr');
            var nameTd = document.createElement('td');
            nameTd.textContent = r.shopName || '（無題）';
            var memoTd = document.createElement('td');
            memoTd.className = 'memo-preview';
            memoTd.textContent = (r.memo || '').trim() || '—';
            var dateTd = document.createElement('td');
            dateTd.className = 'mono';
            dateTd.textContent = (r.updatedAt || r.createdAt || '').slice(0, 19).replace('T', ' ');
            var actTd = document.createElement('td');
            var go = document.createElement('a');
            go.className = 'btn-sm primary';
            go.href = workerUrlWithMemo(r.id);
            go.textContent = '店舗ドラフトで編集へ';
            go.title = '店舗ドラフトを新規モードで開き、店名・メモを流し込みます';
            var del = document.createElement('button');
            del.type = 'button';
            del.className = 'btn-sm danger';
            del.textContent = '削除';
            del.onclick = function () {
              if (!confirm('このメモを削除しますか？')) return;
              credFetch(api + '/memo-leads/' + encodeURIComponent(r.id), { method: 'DELETE' })
                .then(function (res) {
                  if (res.status === 204) return;
                  return res.json().then(function (j) {
                    throw new Error((j && j.error) || res.statusText);
                  });
                })
                .then(function () {
                  showOk('削除しました');
                  return loadList();
                })
                .catch(function (e) {
                  showErr(e.message || String(e));
                });
            };
            actTd.appendChild(go);
            actTd.appendChild(document.createTextNode(' '));
            actTd.appendChild(del);
            tr.appendChild(nameTd);
            tr.appendChild(memoTd);
            tr.appendChild(dateTd);
            tr.appendChild(actTd);
            body.appendChild(tr);
          });
          w.innerHTML = '';
          w.appendChild(tb);
        }

        function loadList() {
          showErr('');
          return credFetch(api + '/memo-leads')
            .then(function (r) {
              return r.json().then(function (j) {
                if (!r.ok) throw new Error((j && j.error) || r.statusText);
                return j;
              });
            })
            .then(function (data) {
              renderList(Array.isArray(data) ? data : []);
            })
            .catch(function (e) {
              document.getElementById('list-wrap').innerHTML =
                '<p class="sub">一覧を取得できませんでした。ログイン状態を確認してください。</p>';
              showErr(e.message || String(e));
            });
        }

        document.getElementById('btn-add').onclick = function () {
          var name = document.getElementById('new-name').value.trim();
          var memo = document.getElementById('new-memo').value.trim();
          if (!name) {
            showErr('店名を入力してください');
            return;
          }
          showErr('');
          credFetch(api + '/memo-leads', {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ shopName: name, memo: memo }),
          })
            .then(function (r) {
              return r.json().then(function (j) {
                if (!r.ok) throw new Error((j && j.error) || r.statusText);
                return j;
              });
            })
            .then(function () {
              document.getElementById('new-name').value = '';
              document.getElementById('new-memo').value = '';
              showOk('追加しました');
              return loadList();
            })
            .catch(function (e) {
              showErr(e.message || String(e));
            });
        };

        loadList();
      })();
    </script>
  </body>
</html>
